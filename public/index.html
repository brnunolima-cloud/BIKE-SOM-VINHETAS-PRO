
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIKE SOM STUDIO</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
  background: #202020;
  padding: 22px;
  border-radius: 16px;
}

h1 {
  color: #ffb000;
  text-align: center;
}

p {
  text-align: center;
  color: #ccc;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

select, textarea, input {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #555;
  background: #303030;
  color: white;
  font-size: 16px;
}

textarea {
  height: 140px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  background: #ffb000;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  font-size: 17px;
}

#resultado {
  margin-top: 20px;
  padding: 15px;
  background: #303030;
  border-radius: 8px;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<div class="container">

<h1>BIKE SOM STUDIO</h1>
<p>Estúdio profissional de vinhetas e locuções</p>

<label>Tipo de produção</label>
<select id="tipo">
<option>Bike Som Propaganda</option>
<option>Vinheta comercial</option>
<option>Chamada promocional</option>
<option>Vinheta de rádio</option>
<option>Outros</option>
</select>

<label>Escolha a voz</label>
<select id="voz">
<option>Masculina</option>
<option>Feminina</option>
</select>

<label>Estilo da locução</label>
<select id="estilo">
<option>Animada</option>
<option>Grave e potente</option>
<option>Profissional</option>
<option>Emocionante</option>
<option>Gospel</option>
<option>Promocional</option>
</select>

<label>Texto da vinheta</label>
<textarea id="texto" placeholder="Digite aqui o texto da sua vinheta..."></textarea>

<label>Nome do cliente</label>
<input id="cliente" placeholder="Nome do cliente">

<button onclick="gerar()">GERAR PRODUÇÃO</button>

<div id="resultado"></div>

</div>

<script>
function gerar() {
  const tipo = document.getElementById("tipo").value;
  const voz = document.getElementById("voz").value;
  const estilo = document.getElementById("estilo").value;
  const texto = document.getElementById("texto").value;
  const cliente = document.getElementById("cliente").value;

  if (!texto.trim()) {
    alert("Digite o texto da vinheta!");
    return;
  }

  document.getElementById("resultado").innerText =
    "BIKE SOM STUDIO\n\n" +
    "Cliente: " + cliente +
    "\nProdução: " + tipo +
    "\nVoz: " + voz +
    "\nEstilo: " + estilo +
    "\n\nTEXTO DA VINHETA:\n" + texto;
}
</script>

</body>
</html>
